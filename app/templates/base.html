<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}Sistem Rekapitulasi Airside{% endblock %} - InJourney Regional II</title>
    
    <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS with Cache Buster -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=20260929_v4">
    
    <!-- Navbar Essential & Bulletproof Mobile Styling -->
    <style>
        .navbar {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0.75rem 1.5rem !important;
            background-color: #ffffff !important;
            border-bottom: 1px solid rgba(226, 232, 240, 0.85) !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .navbar-brand-modern,
        .navbar-brand-modern:hover,
        .navbar-brand-modern:visited,
        .navbar-brand-modern:active,
        .navbar-brand-modern:focus {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 0.65rem !important;
            text-decoration: none !important;
            color: #002b49 !important;
            flex-shrink: 0 !important;
            outline: none !important;
        }

        .brand-icon-tile {
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            border-radius: 10px !important;
            background: linear-gradient(135deg, #003366 0%, #0284c7 100%) !important;
            color: #ffffff !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1rem !important;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25) !important;
            flex-shrink: 0 !important;
        }

        .brand-text-block {
            display: flex !important;
            flex-direction: column !important;
            line-height: 1.15 !important;
        }

        .brand-name {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif !important;
            font-weight: 800 !important;
            font-size: 1.2rem !important;
            color: #002b49 !important;
            text-decoration: none !important;
            white-space: nowrap !important;
            letter-spacing: -0.3px !important;
        }

        .brand-name-accent {
            color: #0284c7 !important;
            font-weight: 700 !important;
        }

        .brand-sub {
            font-size: 0.65rem !important;
            font-weight: 600 !important;
            color: #64748b !important;
            text-transform: uppercase !important;
            letter-spacing: 0.4px !important;
            white-space: nowrap !important;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .nav-user {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.65rem !important;
            flex-shrink: 0 !important;
        }

        .user-pill {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.45rem !important;
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            padding: 0.35rem 0.75rem !important;
            border-radius: 9999px !important;
            white-space: nowrap !important;
        }

        .user-avatar-mini {
            color: #0284c7 !important;
            font-size: 1.05rem !important;
            display: flex !important;
            align-items: center !important;
        }

        .user-name {
            font-size: 0.825rem !important;
            font-weight: 600 !important;
            color: #334155 !important;
            white-space: nowrap !important;
        }

        .btn-logout-modern,
        .btn-logout-modern:visited {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.4rem !important;
            padding: 0.38rem 0.75rem !important;
            border-radius: 8px !important;
            font-size: 0.825rem !important;
            font-weight: 600 !important;
            color: #ef4444 !important;
            background-color: #fef2f2 !important;
            border: 1px solid #fecaca !important;
            text-decoration: none !important;
            cursor: pointer !important;
            white-space: nowrap !important;
            transition: all 0.2s ease !important;
        }

        .btn-logout-modern:hover {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: #ef4444 !important;
        }

        /* Mobile navbar rules: prevent ANY horizontal cramped wrapping */
        @media (max-width: 640px) {
            .navbar {
                padding: 0.6rem 0.85rem !important;
            }
            .brand-icon-tile {
                width: 32px !important;
                height: 32px !important;
                min-width: 32px !important;
                font-size: 0.9rem !important;
            }
            .brand-name {
                font-size: 1.05rem !important;
            }
            .brand-sub {
                display: none !important; /* Hide subtext on phone to keep top app bar clean and single-row */
            }
            .user-pill {
                padding: 0.25rem 0.45rem !important;
                background-color: transparent !important;
                border-color: transparent !important;
            }
            .user-name {
                display: none !important; /* Hide user name string on phone, keep avatar icon */
            }
            .btn-logout-modern .logout-text {
                display: none !important; /* Hide 'Keluar' text, keep icon */
            }
            .btn-logout-modern {
                padding: 0.38rem 0.55rem !important;
            }
        }
    </style>

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- CSRF Token Meta -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Transparent Fetch Interceptor for CSRF -->
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                    const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                    const token = tokenMeta ? tokenMeta.getAttribute('content') : '';
                    if (token) {
                        options.headers = options.headers || {};
                        if (options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRFToken')) options.headers.append('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return originalFetch(url, options);
            };
        })();
    </script>
    
    <!-- InJourney Custom Loading Spinner (SweetAlert2 & Generic) -->
    <style>
        @keyframes injourney-spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Override SweetAlert2 Default Loading Spinner with InJourney Kawung Motif */
        div:where(.swal2-container) .swal2-loader,
        .swal2-loader {
            display: none;
            align-items: center;
            justify-content: center;
            width: 88px !important;
            height: 88px !important;
            min-width: 88px !important;
            min-height: 88px !important;
            border: none !important;
            border-color: transparent !important;
            border-radius: 0 !important;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center !important;
            background-size: contain !important;
            animation: injourney-spin 1s linear infinite !important;
            margin: 0 auto !important;
            box-shadow: none !important;
            filter: drop-shadow(0 8px 20px rgba(0, 51, 102, 0.18));
        }

        div:where(.swal2-container) .swal2-loader::before,
        div:where(.swal2-container) .swal2-loader::after,
        .swal2-loader::before,
        .swal2-loader::after {
            display: none !important;
            content: none !important;
            border: none !important;
        }

        /* Seamless & Professional Loading Modal: Hide white card, title, text - show ONLY spinner */
        div:where(.swal2-container) .swal2-popup.swal2-loading,
        .swal2-popup.swal2-loading {
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
            overflow: visible !important;
        }

        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-title,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-html-container,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-icon,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-close,
        .swal2-popup.swal2-loading .swal2-title,
        .swal2-popup.swal2-loading .swal2-html-container,
        .swal2-popup.swal2-loading .swal2-icon,
        .swal2-popup.swal2-loading .swal2-close {
            display: none !important;
        }

        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-actions,
        .swal2-popup.swal2-loading .swal2-actions {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0 auto !important;
            padding: 0 !important;
            width: auto !important;
        }

        /* Ensure loader is cleanly displayed when Swal.showLoading() is called */
        div:where(.swal2-container) .swal2-actions.swal2-loading .swal2-loader,
        div:where(.swal2-container).swal2-loading .swal2-loader,
        .swal2-actions.swal2-loading .swal2-loader,
        .swal2-loading .swal2-loader {
            display: block !important;
        }

        /* Soft bright frosted glass backdrop for SweetAlert (not too dark) */
        div:where(.swal2-container).swal2-backdrop-show {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(6px) !important;
            -webkit-backdrop-filter: blur(6px) !important;
        }

        div:where(.swal2-container):has(.swal2-loading) {
            background: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(6px) !important;
            -webkit-backdrop-filter: blur(6px) !important;
        }

        /* InJourney Mini Spinners for Badges/Cards/Buttons */
        .injourney-spinner-sm {
            display: inline-block;
            width: 15px;
            height: 15px;
            vertical-align: -2px;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 1s linear infinite;
        }

        .injourney-spinner-md {
            display: inline-block;
            width: 28px;
            height: 28px;
            vertical-align: middle;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 1s linear infinite;
        }
    </style>
    
    {% block head %}{% endblock %}
</head>
<body>
    
    {% if not hide_navbar %}
    <nav class="navbar">
        <a href="/" class="navbar-brand-modern">
            <div class="brand-icon-tile">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <div class="brand-text-block">
                <span class="brand-name">Airside<span class="brand-name-accent">Report</span></span>
                <span class="brand-sub">InJourney Regional II</span>
            </div>
        </a>

        <div class="nav-user">
            {% if current_user %}
            <div class="user-pill" title="{{ current_user.name | default('Admin') }}">
                <div class="user-avatar-mini">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <span class="user-name">{{ current_user.name | default('Admin') }}</span>
            </div>
            <a href="/api/auth/logout" class="btn-logout-modern" title="Keluar dari Sistem">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="logout-text">Keluar</span>
            </a>
            {% endif %}
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
