<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon / Web App Icon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-kawung.png') }}?v=20261019">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='img/logo-kawung.png') }}?v=20261019">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-kawung.png') }}?v=20261019">

    <!-- CSS with Cache Buster -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=20260929_v4">
    
    <!-- Navbar Essential & Bulletproof Mobile Styling -->
    <style>
        .navbar {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0.75rem 1.5rem !important;
            background-color: #ffffff !important;
            border-bottom: 1px solid rgba(226, 232, 240, 0.85) !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .navbar-brand-modern,
        .navbar-brand-modern:hover,
        .navbar-brand-modern:visited,
        .navbar-brand-modern:active,
        .navbar-brand-modern:focus {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 0.65rem !important;
            text-decoration: none !important;
            color: #002b49 !important;
            flex-shrink: 0 !important;
            outline: none !important;
        }

        .brand-icon-tile {
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            border-radius: 10px !important;
            background: #90c1e8 !important;
            color: #002b49 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 1rem !important;
            box-shadow: 0 2px 6px rgba(144, 193, 232, 0.45) !important;
            flex-shrink: 0 !important;
        }

        .brand-text-block {
            display: flex !important;
            flex-direction: column !important;
            line-height: 1.15 !important;
        }

        .brand-name {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif !important;
            font-weight: 800 !important;
            font-size: 1.2rem !important;
            color: #002b49 !important;
            text-decoration: none !important;

            letter-spacing: -0.3px !important;
        }

        .brand-name-accent {
            color: #0284c7 !important;
            font-weight: 700 !important;
        }

        .brand-sub {
            font-size: 0.65rem !important;
            font-weight: 600 !important;
            color: #64748b !important;
            text-transform: uppercase !important;
            letter-spacing: 0.4px !important;
            white-space: nowrap !important;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .nav-user {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.65rem !important;
            flex-shrink: 0 !important;
        }

        .user-pill {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.45rem !important;
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            padding: 0.35rem 0.75rem !important;
            border-radius: 9999px !important;
            white-space: nowrap !important;
        }

        .user-avatar-mini {
            color: #0284c7 !important;
            font-size: 1.05rem !important;
            display: flex !important;
            align-items: center !important;
        }

        .user-name {
            font-size: 0.825rem !important;
            font-weight: 600 !important;
            color: #334155 !important;
            white-space: nowrap !important;
        }

        .btn-logout-modern,
        .btn-logout-modern:visited {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.4rem !important;
            padding: 0.38rem 0.75rem !important;
            border-radius: 8px !important;
            font-size: 0.825rem !important;
            font-weight: 600 !important;
            color: #ef4444 !important;
            background-color: #fef2f2 !important;
            border: 1px solid #fecaca !important;
            text-decoration: none !important;
            cursor: pointer !important;
            white-space: nowrap !important;
            transition: all 0.2s ease !important;
        }

        .btn-logout-modern:hover {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: #ef4444 !important;
        }

        /* Mobile navbar rules: prevent ANY horizontal cramped wrapping */
        @media (max-width: 640px) {
            .navbar {
                padding: 0.6rem 0.85rem !important;
            }
            .brand-icon-tile {
                width: 32px !important;
                height: 32px !important;
                min-width: 32px !important;
                font-size: 0.9rem !important;
            }
            .brand-name {
                font-size: 1.05rem !important;
            }
            .brand-sub {
                display: none !important; /* Hide subtext on phone to keep top app bar clean and single-row */
            }
            .user-pill {
                padding: 0.25rem 0.45rem !important;
                background-color: transparent !important;
                border-color: transparent !important;
            }
            .user-name {
                display: none !important; /* Hide user name string on phone, keep avatar icon */
            }
            .btn-logout-modern .logout-text {
                display: none !important; /* Hide 'Keluar' text, keep icon */
            }
            .btn-logout-modern {
                padding: 0.38rem 0.55rem !important;
            }
        }
    </style>

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- CSRF Token Meta -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Transparent Fetch Interceptor for CSRF -->
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                    const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                    const token = tokenMeta ? tokenMeta.getAttribute('content') : '';
                    if (token) {
                        options.headers = options.headers || {};
                        if (options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRFToken')) options.headers.append('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return originalFetch(url, options);
            };
        })();
    </script>
    
    <!-- InJourney Custom Loading Spinner (SweetAlert2 & Global Overlay) -->
    <style>
        @keyframes injourney-spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Dedicated Fullscreen InJourney Kawung Loading Overlay (Seamless Blend - No Card Frame) */
        .injourney-global-loader {
            position: fixed;
            inset: 0;
            background: rgba(248, 250, 252, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s ease;
        }

        .injourney-global-loader.show {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .injourney-loader-card {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            box-shadow: none !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .injourney-global-loader.show .injourney-loader-card {
            transform: scale(1);
        }

        .injourney-kawung-spinner {
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .injourney-kawung-img {
            width: 78px;
            height: 78px;
            object-fit: contain;
            animation: injourney-spin 2s linear infinite;
            filter: drop-shadow(0 6px 16px rgba(0, 43, 73, 0.14));
            user-select: none;
            -webkit-user-drag: none;
        }

        .injourney-loader-text {
            margin-top: 1rem;
            text-align: center;
            max-width: 340px;
        }

        .injourney-loader-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #002b49;
            margin-bottom: 0.25rem;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .injourney-loader-sub {
            font-size: 0.8rem;
            color: #475569;
            font-weight: 500;
            line-height: 1.4;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* Override SweetAlert2 Default Loading Spinner with Seamless InJourney Kawung Motif */
        div:where(.swal2-container).swal2-backdrop-show,
        div:where(.swal2-container):has(.swal2-loading) {
            background: rgba(248, 250, 252, 0.7) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
        }

        div:where(.swal2-container) .swal2-popup.swal2-loading,
        .swal2-popup.swal2-loading {
            background: transparent !important;
            background-color: transparent !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
            width: auto !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important;
            overflow: visible !important;
        }

        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-title,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-html-container,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-icon,
        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-close,
        .swal2-popup.swal2-loading .swal2-title,
        .swal2-popup.swal2-loading .swal2-html-container,
        .swal2-popup.swal2-loading .swal2-icon,
        .swal2-popup.swal2-loading .swal2-close {
            display: none !important;
        }

        div:where(.swal2-container) .swal2-popup.swal2-loading .swal2-actions,
        .swal2-popup.swal2-loading .swal2-actions {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0 !important;
            padding: 0 !important;
            width: auto !important;
        }

        div:where(.swal2-container) .swal2-loader,
        .swal2-loader {
            display: none;
            align-items: center;
            justify-content: center;
            width: 78px !important;
            height: 78px !important;
            min-width: 78px !important;
            min-height: 78px !important;
            border: none !important;
            border-color: transparent !important;
            border-radius: 0 !important;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center !important;
            background-size: contain !important;
            animation: injourney-spin 2s linear infinite !important;
            margin: 0 auto !important;
            box-shadow: none !important;
            filter: drop-shadow(0 6px 16px rgba(0, 43, 73, 0.14));
        }

        div:where(.swal2-container) .swal2-loader::before,
        div:where(.swal2-container) .swal2-loader::after,
        .swal2-loader::before,
        .swal2-loader::after {
            display: none !important;
            content: none !important;
            border: none !important;
        }

        div:where(.swal2-container) .swal2-actions.swal2-loading .swal2-loader,
        div:where(.swal2-container).swal2-loading .swal2-loader,
        .swal2-actions.swal2-loading .swal2-loader,
        .swal2-loading .swal2-loader {
            display: block !important;
        }

        /* Inline Kawung Spinners for Badges/Buttons/Card Viewers */
        .kawung-inline-spin {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 2s linear infinite;
        }
        .kawung-inline-spin-md {
            display: inline-block;
            width: 36px;
            height: 36px;
            vertical-align: middle;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 2s linear infinite;
        }
        .kawung-inline-spin-lg {
            display: inline-block;
            width: 64px;
            height: 64px;
            vertical-align: middle;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 2s linear infinite;
        }
        .injourney-spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: -2px;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 2s linear infinite;
        }
        .injourney-spinner-md {
            display: inline-block;
            width: 28px;
            height: 28px;
            vertical-align: middle;
            background: url("{{ url_for('static', filename='img/logo-kawung.png') }}") no-repeat center center;
            background-size: contain;
            animation: injourney-spin 2s linear infinite;
        }
    </style>
    
    {% block head %}{% endblock %}
</head>
<body>
    
    <!-- Global InJourney Kawung Loading Overlay (Blurred Frosted Glass Backdrop) -->
    <div class="injourney-global-loader" id="injourneyGlobalLoader" aria-hidden="true">
        <div class="injourney-loader-card">
            <div class="injourney-kawung-spinner">
                <img src="{{ url_for('static', filename='img/logo-kawung.png') }}" alt="InJourney Airports" class="injourney-kawung-img">
            </div>
            <div class="injourney-loader-text" id="injourneyLoaderText" style="display: none;">
                <div class="injourney-loader-title" id="injourneyLoaderTitle"></div>
                <div class="injourney-loader-sub" id="injourneyLoaderSub"></div>
            </div>
        </div>
    </div>

    {% if not hide_navbar %}
    <nav class="navbar">
        <a href="/" class="navbar-brand-modern">
            <div class="brand-icon-tile">
                <i class="fa-solid fa-plane-departure"></i>
            </div>
            <div class="brand-text-block">
                <span class="brand-name">Airside<span class="brand-name-accent">Report</span></span>
                <span class="brand-sub">InJourney Regional II</span>
            </div>
        </a>

        <div class="nav-user">
            {% if current_user %}
            <div class="user-pill" title="{{ current_user.name | default('Admin') }}">
                <div class="user-avatar-mini">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <span class="user-name">{{ current_user.name | default('Admin') }}</span>
            </div>
            <a href="/api/auth/logout" class="btn-logout-modern" title="Keluar dari Sistem">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="logout-text">Keluar</span>
            </a>
            {% endif %}
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Kawung Loader Controller Script -->
    <script>
        window.showKawungLoading = function(title, sub) {
            const overlay = document.getElementById('injourneyGlobalLoader');
            if (!overlay) return;
            const titleEl = document.getElementById('injourneyLoaderTitle');
            const subEl = document.getElementById('injourneyLoaderSub');
            const textWrap = document.getElementById('injourneyLoaderText');

            if (title || sub) {
                if (titleEl) titleEl.textContent = title || '';
                if (subEl) subEl.textContent = sub || '';
                if (textWrap) textWrap.style.display = 'block';
            } else {
                if (textWrap) textWrap.style.display = 'none';
            }
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
        };

        window.hideKawungLoading = function() {
            const overlay = document.getElementById('injourneyGlobalLoader');
            if (overlay) {
                overlay.classList.remove('show');
                overlay.setAttribute('aria-hidden', 'true');
            }
        };

        // Aliases for unified system access
        window.showDriveLoading = window.showKawungLoading;
        window.hideDriveLoading = window.hideKawungLoading;
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
