<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistem Rekapitulasi Airside{% endblock %} - InJourney Regional II</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- CSRF Token Meta -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Transparent Fetch Interceptor for CSRF -->
    <script>
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                    const tokenMeta = document.querySelector('meta[name="csrf-token"]');
                    const token = tokenMeta ? tokenMeta.getAttribute('content') : '';
                    if (token) {
                        options.headers = options.headers || {};
                        if (options.headers instanceof Headers) {
                            if (!options.headers.has('X-CSRFToken')) options.headers.append('X-CSRFToken', token);
                        } else if (Array.isArray(options.headers)) {
                            options.headers.push(['X-CSRFToken', token]);
                        } else {
                            if (!options.headers['X-CSRFToken']) options.headers['X-CSRFToken'] = token;
                        }
                    }
                }
                return originalFetch(url, options);
            };
        })();
    </script>
    
    {% block head %}{% endblock %}
</head>
<body>
    
    {% if not hide_navbar %}
    <nav class="navbar">
        <div class="d-flex align-items-center" style="gap: 0.75rem;">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-plane-departure"></i>
                <span>Airside Report</span>
            </a>
            <span style="font-size: 0.75rem; font-weight: 600; background-color: #f1f5f9; color: #003366; padding: 0.2rem 0.6rem; border-radius: 6px; border: 1px solid #e2e8f0; letter-spacing: 0.2px;">
                InJourney Regional II
            </span>
        </div>
        <div class="nav-user">
            {% if current_user %}
            <div class="user-badge" style="font-size: 0.875rem; color: #475569;">
                <i class="fa-solid fa-circle-user" style="color: #0284c7; font-size: 1.15rem;"></i>
                <span>{{ current_user.name | default('Admin') }}</span>
            </div>
            <a href="/api/auth/logout" class="btn btn-outline btn-sm">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </a>
            {% endif %}
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
